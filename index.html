<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学内申請・要求アプリ</title>
  <!-- Tailwind CSS（デザインを素早く整えるためのライブラリ） -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

  <!-- ヘッダー -->
  <header class="bg-blue-700 text-white p-4 shadow-md">
    <div class="container mx-auto flex justify-between items-center">
      <h1 id="app-title" class="text-xl font-bold">学内申請アプリ</h1>
      <button id="logout-btn" class="bg-blue-600 hover:bg-blue-800 text-white px-3 py-1 rounded text-sm hidden">ログアウト</button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="container mx-auto px-4 py-8 max-w-md flex-grow">
    
    <!-- 1. ログインフォーム -->
    <div id="login-section" class="bg-white p-6 rounded-lg shadow-md">
      <h2 class="text-lg font-bold mb-4 text-center">教職員ログイン</h2>
      <div class="mb-4">
        <label class="block text-sm font-bold mb-1">学内メールアドレス</label>
        <input type="email" id="login-email" class="w-full border rounded p-2" placeholder="example@school.ac.jp">
      </div>
      <div class="mb-6">
        <label class="block text-sm font-bold mb-1">パスワード</label>
        <input type="password" id="login-password" class="w-full border rounded p-2">
      </div>
      <button id="login-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded">ログイン</button>
      <p id="login-error" class="text-red-500 text-sm mt-2 text-center hidden"></p>
    </div>

    <!-- 2. 申請フォーム（ログイン後に表示） -->
    <div id="form-section" class="bg-white p-6 rounded-lg shadow-md hidden">
      <div class="border-b pb-4 mb-4">
        <h2 id="form-title" class="text-xl font-bold text-blue-700">申請タイトル</h2>
        <p id="form-desc" class="text-gray-600 text-sm mt-1">説明文がここに表示されます。</p>
      </div>

      <!-- 既に申請済みの場合のメッセージ -->
      <div id="already-submitted" class="bg-yellow-50 border border-yellow-200 text-yellow-800 p-4 rounded mb-4 hidden text-center font-bold">
        今回の申請は既に完了しています。
      </div>

      <!-- 申請者情報表示と申請ボタン（未申請の場合のみ表示） -->
      <form id="request-form" class="space-y-4">
        <!-- 所属部署の表示エリア -->
        <div class="bg-gray-50 p-3 rounded border">
          <span class="block text-xs font-bold text-gray-500 mb-1">所属部署</span>
          <span id="display-dept" class="text-base font-semibold text-gray-800">取得中...</span>
        </div>

        <!-- 氏名の表示エリア -->
        <div class="bg-gray-50 p-3 rounded border">
          <span class="block text-xs font-bold text-gray-500 mb-1">教職員氏名</span>
          <span id="display-name" class="text-base font-semibold text-gray-800">取得中...</span>
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded shadow">
          この内容で申請する
        </button>
      </form>
    </div>

  </main>

  <!-- フッター -->
  <footer class="bg-gray-100 text-center py-4 text-xs text-gray-500 border-t">
    &copy; 2026 学内システム管理
  </footer>

  <!-- Firebase SDK（Ver 9の互換モード / 以前のコードと組み合わせやすい記述を採用しています） -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // ==========================================
    // ★★★ ここに以前の「Firebase初期設定情報」を貼り付けてください ★★★
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyAL9f7KI0DfiOo0xqGGdAMKWFCI82k31N8",
      authDomain: "reserved-room-d300a.firebaseapp.com",
      projectId: "reserved-room-d300a",
      storageBucket: "reserved-room-d300a.firebasestorage.app",
      messagingSenderId: "821240889276",
      appId: "1:821240889276:web:00fbaa6fcdd955badb75b9"
    };

    // Firebase 初期化
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ==========================================
    // ★★★ 申請の設定（ここを書き換えて使い回します！） ★★★
    // ==========================================
    const CURRENT_APPLICATION = {
      appKey: "book-2026-07", // ★合言葉（今回の冊子注文用のキー）
      title: "私学共済発行ハーモニー夏号 配布希望申請",
      description: "希望される教職員の方にハーモニー夏号をお配りします。お一人様1冊までとなります。希望される方は申請してください。",
      isClosed: false // ★ここを追加！ true にすると「停止中」になります。受付中は false にします。
    };

    // 画面の初期表示設定
    document.getElementById('app-title').textContent = CURRENT_APPLICATION.title;
    document.getElementById('form-title').textContent = CURRENT_APPLICATION.title;
    document.getElementById('form-desc').textContent = CURRENT_APPLICATION.description;

    let currentUser = null;

    // グローバル変数で所属と氏名を保持する変数
    let detectedDept = "不明";
    let detectedName = "不明";

    // ログイン状態の監視
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUser = user;
        showSection('form-section');
        document.getElementById('logout-btn').classList.remove('hidden');

        // --- ★ここから追加★ ---
        if (CURRENT_APPLICATION.isClosed) {
          // 既に申請済みメッセージのエリアを流用して、停止中メッセージを表示する
          const alreadySubmittedMsg = document.getElementById('already-submitted');
          const requestForm = document.getElementById('request-form');
          
          requestForm.classList.add('hidden');
          alreadySubmittedMsg.textContent = "この注文アプリは現在停止中（受付期間外）です。";
          alreadySubmittedMsg.classList.remove('hidden');
          
          // 停止中の場合は、以下のデータ取得処理などはスキップする
          return;
        }
        // --- ★ここまで追加★ ---
        
        try {
          // ★★★ Firestore の "users" コレクションから、ログインユーザーの情報を取得する ★★★
          // ドキュメントIDが user.uid になっているデータを1件取得します
          const userDoc = await db.collection("common_users").doc(user.uid).get();

          if (userDoc.exists) {
            const userData = userDoc.data();
            console.log("Firestoreから取得したユーザーデータ:", userData);

            // 🌟 修正箇所：応接アプリに合わせ、userData.dept を最優先で取得するように変更しました
            detectedDept = userData.dept || userData.department || userData.registerDept || userData.userDept || "部署登録なし";
            detectedName = userData.name || userData.userName || userData.registerName || "名前登録なし";

          } else {
            // もし "users" コレクションに user.uid のデータが直接見つからない場合、
            // email で検索をかける予備の処理（フォールバック）を走らせます
            const emailQuery = await db.collection("users").where("email", "==", user.email).get();
            if (!emailQuery.empty) {
              const userData = emailQuery.docs[0].data();
              // 🌟 修正箇所：こちらも同様に userData.dept を最優先に探すように変更しました
              detectedDept = userData.dept || userData.department || userData.registerDept || userData.userDept || "部署登録なし";
              detectedName = userData.name || userData.userName || userData.registerName || "名前登録なし";
            } else {
              console.warn("ユーザープロファイルがデータベースに見つかりませんでした。");
              detectedDept = "プロファイル未登録";
              detectedName = "（新規ユーザー）";
            }
          }
        } catch (error) {
          console.error("プロフィール取得エラー:", error);
          detectedDept = "エラー";
          detectedName = "データ取得失敗";
        }

        // 画面にテキストとして表示
        document.getElementById('display-dept').textContent = detectedDept;
        document.getElementById('display-name').textContent = detectedName;

        // すでに今回の合言葉で申請済みかチェックする
        checkAlreadySubmitted(user.email);
      } else {
        currentUser = null;
        showSection('login-section');
        document.getElementById('logout-btn').classList.add('hidden');
      }
    });

    // セクションの切り替え表示
    function showSection(sectionId) {
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('form-section').classList.add('hidden');
      document.getElementById(sectionId).classList.remove('hidden');
    }

    // ログイン処理
    document.getElementById('login-btn').addEventListener('click', () => {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const errorEl = document.getElementById('login-error');

      auth.signInWithEmailAndPassword(email, password)
        .catch(error => {
          errorEl.textContent = "ログインに失敗しました。メールアドレスまたはパスワードを確認してください。";
          errorEl.classList.remove('hidden');
        });
    });

    // ログアウト処理
    document.getElementById('logout-btn').addEventListener('click', () => {
      auth.signOut();
    });

    // 重複申請チェック関数
    async function checkAlreadySubmitted(email) {
      const submitBtn = document.getElementById('submit-btn');
      const requestForm = document.getElementById('request-form');
      const alreadySubmittedMsg = document.getElementById('already-submitted');

      try {
        // Firestoreから「今回の合言葉（appKey）」で、かつ「ログインユーザーのemail」に一致するデータを検索
        const querySnapshot = await db.collection("requests")
          .where("appKey", "==", CURRENT_APPLICATION.appKey)
          .where("email", "==", email)
          .get();

        if (!querySnapshot.empty) {
          // すでにデータが存在する場合：フォームを非表示にしてメッセージを出す
          requestForm.classList.add('hidden');
          alreadySubmittedMsg.classList.remove('hidden');
        } else {
          // まだ申請していない場合：通常通り表示
          requestForm.classList.remove('hidden');
          alreadySubmittedMsg.classList.add('hidden');
        }
      } catch (error) {
        console.error("重複チェックエラー: ", error);
      }
    }

    // 申請フォーム送信処理
    document.getElementById('request-form').addEventListener('submit', async (e) => {
      e.preventDefault(); // ページのリロードを防ぐ
      
      const submitBtn = document.getElementById('submit-btn');
      
      // 二重送信を防ぐために一時的に無効化
      submitBtn.disabled = true;
      submitBtn.textContent = "送信中...";

      try {
        // グローバル変数で取得・保持している「detectedDept（部署）」と「detectedName（氏名）」を
        // そのまま Firestore の "requests" コレクションに書き込みます
        await db.collection("requests").add({
          appKey: CURRENT_APPLICATION.appKey,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          email: currentUser.email,
          department: detectedDept, // ログイン時に取得した部署
          userName: detectedName,   // ログイン時に取得した氏名
          status: "未配布"
        });

        alert("申請が完了しました！");
        
        // 申請完了したら、再度重複チェックを走らせてフォームを非表示にします
        await checkAlreadySubmitted(currentUser.email);

      } catch (error) {
        console.error("送信エラー:", error);
        alert("送信に失敗しました。エラー: " + error.message);
        
        // エラー時はボタンを元に戻して再試行できるようにする
        submitBtn.disabled = false;
        submitBtn.textContent = "この内容で申請する";
      }
    });
  </script>
</body>
</html>
